<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa Perú Analítico</title>
  <meta name="description" content="Inteligencia territorial del Perú: seguridad ciudadana, clima combinado, movilidad, ambiente e infraestructura con procedencia verificable.">
  <meta name="theme-color" content="#05080c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305080c'/%3E%3Crect x='4' y='4' width='8' height='8' fill='none' stroke='%2300d4ff' stroke-width='2' transform='rotate(45 8 8)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body>
  <a class="skip" href="#panel">Saltar a la ficha del territorio</a>

  <main class="map-wrap" id="main">
    <div id="map" role="region" aria-label="Mapa"></div>
  </main>

  <header class="topbar hud hud-frame">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Mapa Perú Analítico<small>INTEL · PE</small></span></h1>
    <form class="search" role="search" id="search-form" autocomplete="off">
      <label class="sr-only" for="search">Buscar departamento, provincia o distrito</label>
      <input id="search" type="search" placeholder="Buscar territorio…" aria-describedby="search-hint" aria-controls="search-results">
      <span id="search-hint" class="sr-only">Escribe al menos dos letras y elige un resultado</span>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </form>
    <div class="modes" role="tablist" aria-label="Modo de trabajo" id="modes">
      <button type="button" role="tab" data-mode="mapa" aria-selected="true">Mapa</button>
      <button type="button" role="tab" data-mode="patrones" aria-selected="false">Patrones</button>
      <button type="button" role="tab" data-mode="rutas" aria-selected="false">Rutas</button>
      <button type="button" role="tab" data-mode="ninio" aria-selected="false">El Niño</button>
    </div>
    <div class="live-strip" id="live-strip" aria-label="Estado de los proveedores en vivo"></div>
    <div class="top-actions">
      <button class="btn btn-primary" type="button" id="open-assistant" aria-haspopup="dialog" title="Asistente de voz (Alt+V)">🎙 Asistente</button>
      <button class="btn btn-ghost" type="button" id="open-cameras" aria-haspopup="dialog" title="Conectar mis cámaras (Dahua, ONVIF, RTSP)">Cámaras</button>
      <button class="btn btn-ghost" type="button" id="open-sources" aria-haspopup="dialog">Fuentes</button>
      <button class="btn btn-ghost" type="button" id="open-admin" aria-haspopup="dialog" title="Administrador de IA: modos, proveedores, voz y presupuesto">IA</button>
      <button class="btn btn-ghost" type="button" id="open-settings" aria-haspopup="dialog">Claves</button>
      <button class="btn btn-ghost btn-icon" type="button" id="toggle-wide" aria-pressed="false" aria-label="Vista amplia: ocultar todos los paneles (tecla F)" title="Vista amplia (F)">⛶</button>
      <button class="btn btn-ghost btn-icon" type="button" id="toggle-theme" aria-label="Cambiar entre modo noche y día" title="Noche / día">◐</button>
    </div>
  </header>

  <div class="stage">
    <nav class="rail hud hud-frame" id="rail" aria-label="Familias de capas">
      <div class="rail-head">
        <h2 class="rail-title">Capas</h2>
        <button class="btn btn-ghost btn-icon collapse-btn" type="button" data-collapse="rail" aria-label="Replegar el panel de capas (tecla [)" title="Replegar ([)">«</button>
        <div class="kind-key" aria-label="Naturaleza del dato" id="kind-key"></div>
      </div>
      <div id="families"></div>
    </nav>

    <div class="map-hud" aria-live="polite">
      <div class="layer-title hud" id="layer-title"></div>
      <div class="level-switch hud" role="radiogroup" aria-label="Nivel territorial" id="level-switch"></div>
      <div class="view-tools hud" role="group" aria-label="Vista">
        <button class="btn btn-ghost" type="button" id="btn-3d" aria-pressed="false" title="Relieve 3D e inclinación">3D</button>
        <button class="btn btn-ghost" type="button" id="btn-relief" aria-pressed="false" title="Sombreado de relieve">Relieve</button>
        <button class="btn btn-ghost" type="button" id="btn-north" title="Restablecer norte y vista vertical">N</button>
      </div>
    </div>
    <section class="legend hud" id="legend" aria-label="Leyenda"></section>
    <div class="map-toast" id="toast" role="status" hidden></div>

    <aside class="panel hud hud-frame" id="panel" aria-label="Ficha del territorio" tabindex="-1">
      <div class="panel-tools"><button class="btn btn-ghost btn-icon" type="button" data-collapse="panel" aria-label="Replegar la ficha (tecla ])" title="Replegar (])">»</button></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>

  <footer class="spine hud hud-frame" id="spine" aria-label="Línea de tiempo">
    <div class="spine-presets" role="radiogroup" aria-label="Ventana temporal" id="presets"></div>
    <div class="spine-chart" id="spine-chart"></div>
    <div class="spine-note"><div id="spine-note"></div>
      <div class="spine-actions"><button class="btn" type="button" id="play-years" aria-pressed="false" title="Recorrer los años en el mapa">▶ Años</button>
      <button class="btn btn-ghost btn-icon" type="button" data-collapse="spine" aria-label="Replegar la línea de tiempo" title="Replegar">▾</button></div></div>
  </footer>

  <button type="button" class="edge-tab edge-tab--rail" data-expand="rail" aria-label="Mostrar el panel de capas">Capas »</button>
  <button type="button" class="edge-tab edge-tab--panel" data-expand="panel" aria-label="Mostrar la ficha">« Ficha</button>
  <button type="button" class="edge-tab edge-tab--spine" data-expand="spine" aria-label="Mostrar la línea de tiempo">▴ Tiempo</button>
  <button type="button" class="edge-tab edge-tab--wide" data-expand="wide" aria-label="Salir de la vista amplia">⛶ Paneles</button>

  <section class="assistant hud hud-frame" id="assistant" aria-label="Asistente de voz" hidden></section>
  <section class="story hud hud-frame" id="story" aria-label="Historia del evento" aria-live="polite" hidden></section>
  <section class="cam-viewer hud hud-frame" id="cam-viewer" aria-label="Visor de cámaras" hidden></section>
  <div class="pick-banner hud" id="pick-banner" role="status" hidden></div>

  <nav class="tabbar hud" aria-label="Vistas en móvil">
    <button type="button" class="tab" data-sheet="rail" aria-pressed="false">Capas</button>
    <button type="button" class="tab" data-sheet="map" aria-pressed="true">Mapa</button>
    <button type="button" class="tab" data-sheet="panel" aria-pressed="false">Ficha</button>
  </nav>

  <dialog class="drawer" id="sources-dialog" aria-labelledby="sources-title">
    <div class="drawer-head">
      <h2 id="sources-title">¿De dónde sale cada dato?</h2>
      <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="drawer-body" id="sources-body"></div>
  </dialog>

  <dialog class="drawer" id="cameras-dialog" aria-labelledby="cameras-title">
    <div class="drawer-head">
      <h2 id="cameras-title">Mis cámaras · vision-edge</h2>
      <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="drawer-body" id="cameras-body"></div>
  </dialog>

  <dialog class="drawer" id="admin-dialog" aria-labelledby="admin-title">
    <div class="drawer-head">
      <h2 id="admin-title">Administrador de IA · /admin/engineering/ai</h2>
      <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="drawer-body" id="admin-body"></div>
  </dialog>

  <dialog class="drawer" id="settings-dialog" aria-labelledby="settings-title">
    <div class="drawer-head">
      <h2 id="settings-title">Claves y modelos (local)</h2>
      <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Cerrar">✕</button>
    </div>
    <form class="drawer-body settings" id="settings-form"></form>
  </dialog>

  <script src="vendor/maplibre/maplibre-gl-csp.js"></script>
  <script src="vendor/satellite/satellite.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
