# Mapa Perú Analítico — un contenedor principal; servicios de IA local opcionales por perfil.
#   docker compose up -d                      → solo el mapa (usa Ollama del anfitrión si está instalado)
#   docker compose --profile voz up -d        → + Whisper (voz a texto) y Kokoro (texto a voz) locales, sin Internet
#   docker compose --profile camaras up -d    → + go2rtc para video fluido de tus cámaras (usa data/vision/go2rtc.yaml)
services:
  mapa:
    image: mapa-peru-analitico:0.3
    build: .
    ports:
      - "127.0.0.1:8360:8360"   # solo este equipo: el servidor no tiene autenticación para red abierta
    volumes:
      - mapa-datos:/app/data
    environment:
      PI_AI_BASE_WHISPER_LOCAL: http://whisper:8000/v1
      PI_AI_BASE_KOKORO_LOCAL: http://kokoro:8880/v1
      PI_GO2RTC_URL: http://go2rtc:1984
      PI_GO2RTC_LISTEN: ":1984"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  whisper:
    profiles: ["voz"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    volumes: ["whisper-modelos:/home/ubuntu/.cache/huggingface"]
    restart: unless-stopped

  kokoro:
    profiles: ["voz"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

  go2rtc:
    profiles: ["camaras"]
    image: alexxit/go2rtc:latest
    volumes:
      - mapa-datos:/datos:ro
    command: ["go2rtc", "-config", "/datos/vision/go2rtc.yaml"]
    restart: unless-stopped

volumes:
  mapa-datos:
  whisper-modelos:
